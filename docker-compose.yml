version: '3.8'

services:
  # NewSMS - 多设备短信转发器
  newsms:
    build:
      context: .
      dockerfile: Dockerfile.multi
    image: uart_sms_forwarder-multi:latest
    container_name: NewSMS
    privileged: true
    devices:
      # 映射所有 9 个 USB 设备
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/ttyACM1:/dev/ttyACM1
      - /dev/ttyACM2:/dev/ttyACM2
      - /dev/ttyACM3:/dev/ttyACM3
      - /dev/ttyACM4:/dev/ttyACM4
      - /dev/ttyACM5:/dev/ttyACM5
      - /dev/ttyACM6:/dev/ttyACM6
      - /dev/ttyACM7:/dev/ttyACM7
      - /dev/ttyACM8:/dev/ttyACM8
    ports:
      - "8080:8080"  # 统一端口
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    labels:
      - "sms.type=multi-device"
      - "sms.devices=3"